services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: grakchawwaa-bot
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - grakchawwaa-network
    restart: unless-stopped

networks:
  grakchawwaa-network:
    external: true
