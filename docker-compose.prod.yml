services:
  postgres:
    image: postgres:16-alpine
    container_name: grakchawwaa-postgres-prod
    environment:
      POSTGRES_USER: ${PGUSER:-grakchawwaa}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-grakchawwaa_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-grakchawwaa} -d ${PGDATABASE:-grakchawwaa_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: node:24-alpine
    container_name: grakchawwaa-migrate
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: production
    command: sh -c "corepack enable && pnpm install && cd packages/core && npx mikro-orm migration:up && echo 'Migrations completed successfully'"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production

  bot:
    image: node:24-alpine
    container_name: grakchawwaa-bot-prod
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: production
    command: sh -c "corepack enable && pnpm install && pnpm build && pnpm --filter @grakchawwaa/discord-bot start"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    restart: unless-stopped

  worker:
    image: node:24-alpine
    container_name: grakchawwaa-worker-prod
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: production
    command: sh -c "corepack enable && pnpm install && pnpm build && pnpm --filter @grakchawwaa/worker start"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    restart: unless-stopped

  web:
    image: node:24-alpine
    container_name: grakchawwaa-web-prod
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: production
    command: sh -c "corepack enable && pnpm install && pnpm build && pnpm --filter @grakchawwaa/web start"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    restart: unless-stopped

volumes:
  postgres_data:
  node_modules:
