services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grakchawwaa-bot
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://grakchawwaa-backend:3000}
    networks:
      - grakchawwaa-network
    command: pnpm dev

networks:
  grakchawwaa-network:
    external: true
    name: grakchawwaa-backend_grakchawwaa-network

